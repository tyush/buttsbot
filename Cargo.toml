[package]
name = "buttsbot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.19", features = ["full", "sync"] }
rand = "0.8"
serenity = {version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "utils", "rustls_backend"] }
env_logger = "0.9"
log = "0.4"
dotenv = "0.15"
hypher = { version = "0.1", default-features = false, features = ["english"] }
once_cell = "1.14.0"
lazy_static = "1.4.0"
poise = "0.6.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.151"
candle-core = "0.11.0"
candle-transformers = "0.11.0"
candle-nn = "0.11.0"
tokenizers = { version = "0.23.1", features = ["http"] }
anyhow = "1.0.104"
hf-hub = { version = "0.3.2", features = ["tokio"] }
